<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Reset OTP</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f7;
      margin: 0;
      padding: 0;
      color: #51545e;
    }
    .email-wrapper {
      width: 100%;
      background-color: #f4f4f7;
      padding: 20px;
    }
    .email-content {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 5px;
      box-shadow: 0 2px 3px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333333;
      font-size: 24px;
    }
    p {
      font-size: 16px;
      line-height: 1.5em;
    }
    .otp {
      display: inline-block;
      font-size: 28px;
      letter-spacing: 4px;
      padding: 10px 20px;
      border-radius: 5px;
      background-color: #1a73e8;
      color: white;
      font-weight: bold;
      margin: 20px 0;
    }
    .footer {
      font-size: 12px;
      color: #a8a8b3;
      margin-top: 30px;
      text-align: center;
    }
    @media only screen and (max-width: 620px) {
      .email-content {
        width: 100% !important;
        padding: 20px !important;
      }
      .otp {
        font-size: 24px !important;
        padding: 8px 16px !important;
      }
    }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-content">
      <h1>Password Reset Request</h1>
      <p>Hi {{FIRST_NAME}},</p>
      <p>Use the OTP below to verify your identity and proceed:</p>
      <div class="otp">{{OTP_CODE}}</div>
      <p>This OTP is valid for 10 minutes.</p>
      </div>
    </div>
  </div>
</body>
</html>
